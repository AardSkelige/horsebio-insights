
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: horsebio_frontend_local
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - VITE_DOCKER_ENV=true
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
    command: npm run dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: horsebio_backend_local
    ports:
      # На боевом порт не публикуется вовсе: снаружи только Caddy. Здесь он
      # нужен фронтенду вне Docker (vite.config.js проксирует на 8001).
      - "8001:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      # На боевом поднимается gunicorn; здесь нужен runserver — он сам
      # перечитывает изменённый код, а каталог смонтирован из репозитория.
      - DJANGO_DEV_SERVER=1
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - scripts_logs:/app/scripts_logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: horsebio_db_local
    environment:
      - POSTGRES_DB=horsebio_db
      - POSTGRES_USER=horsebio
      - POSTGRES_PASSWORD=horsebio
      - POSTGRES_MAX_CONNECTIONS=500  # Увеличиваем максимум соединений
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horsebio -d horsebio_db"]  # Исправили healthcheck
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped


volumes:
  postgres_data:        # База данных PostgreSQL
  backend_static:       # Статические файлы Django (CSS, JS, images)
  frontend_node_modules: # NPM пакеты фронтенда
  scripts_logs:         # Логи автоматизированных скриптов

networks:
  app-network:
    driver: bridge