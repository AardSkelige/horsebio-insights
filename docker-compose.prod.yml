# Контейнеров два: приложение и база. Статику — и собранный фронтенд,
# и файлы админки Django — отдаёт общий Caddy прямо из томов. До 06.09.2026
# перед ним стояли ещё два nginx, которые только перекладывали запрос дальше.
#
# Том horsebio_frontend_static здесь не объявлен намеренно: его наполняет
# деплой фронтенда (образ копирует файлы и завершается), и ни один здешний
# сервис его не монтирует.
services:
  backend:
    image: ghcr.io/aardskelige/horsebio-backend:latest
    container_name: horsebio_backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env.prod
    volumes:
      - backend_static:/app/staticfiles
      - django_cache:/app/cache
      - scripts_logs:/app/scripts_logs
      # Состояния демонов здесь больше нет: 06–07.09.2026 все восемь томов
      # разошлись (MIGRATION-PLAN.md, этап 6). Семь состояний переехали
      # в Postgres — там они бэкапятся вместе с базой и не зависят от того,
      # не забыли ли смонтировать том. Восьмой, hb_health_data, оказался
      # производным: его файлы переписывает из базы export_exceptions_to_json
      # перед каждым прогоном.
      # Состояние бэкапа для проверки «Бэкапы» на странице /checks. Только чтение
      # и только каталог state: в самих архивах лежат .env.prod и приватные ключи,
      # их приложению видеть незачем. Каталог на хосте, а не volume — пишет его
      # скрипт бэкапа, который живёт вне Docker.
      - /root/backup/state:/app/backup-state:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: horsebio_db_prod
    environment:
      - POSTGRES_DB=horsebio_db
      - POSTGRES_USER=horsebio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=500
    command: >
      postgres 
      -c max_connections=500
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_io_concurrency=200
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horsebio -d horsebio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped


volumes:
  backend_static:
  postgres_data:
  django_cache:
  scripts_logs:

networks:
  app-network:
    driver: bridge
