services:
  backend:
    image: ghcr.io/aardskelige/horsebio-backend:latest
    container_name: horsebio_backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env.prod
    volumes:
      - backend_static:/app/staticfiles
      - django_cache:/app/cache
      - scripts_logs:/app/scripts_logs
      # Состояние демонов МойСклад: без volume оно живёт в контейнере и стирается
      # каждым деплоем (демоны пересканируют всю историю с START_DATE)
      - hb_returns_data:/app/moysklad/horsebio/01_daemons/03_returns/data
      - hb_buy_prices_data:/app/moysklad/horsebio/01_daemons/02_buy_prices/data
      - hb_deadlines_data:/app/moysklad/horsebio/01_daemons/05_payment_deadline/data
      - hb_order_email_data:/app/moysklad/horsebio/01_daemons/06_order_email_sync/data
      - hb_cdek_waybills_data:/app/moysklad/horsebio/01_daemons/07_cdek_waybills/data
      # Ack-файлы health-чеков: пишутся через API (подтверждение из UI),
      # без volume каждый деплой откатывает их к снимку из образа
      - hb_health_data:/app/moysklad/horsebio/02_checks/01_health/data
      # Копия заказов сайта: подтверждённые в выгрузке заказы сайт больше не
      # отдаёт, так что этот файл — единственный их экземпляр
      - hb_site_orders_data:/app/moysklad/horsebio/02_checks/02_site_orders/data
      # Состояние бэкапа для проверки «Бэкапы» на странице /checks. Только чтение
      # и только каталог state: в самих архивах лежат .env.prod и приватные ключи,
      # их приложению видеть незачем. Каталог на хосте, а не volume — пишет его
      # скрипт бэкапа, который живёт вне Docker.
      - /root/backup/state:/app/backup-state:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  backend_nginx:
    image: nginx:alpine
    container_name: horsebio_backend_nginx
    ports:
      # Только localhost, а не все интерфейсы. Раньше стояло "8001:8001",
      # что означает 0.0.0.0 — и админка Django была доступна снаружи
      # по HTTP открытым текстом: `http://<ip>:8001/admin/` отвечал 302.
      # Проверено 02.09.2026, тогда же и закрыто.
      #
      # Порт нужен изнутри машины: 20 задач в crontab ходят на
      # http://localhost:8001/api/scripts/<id>/run/. Когда их переведут
      # на management-команду (MIGRATION-PLAN.md, этап 1), эту публикацию
      # можно убрать совсем — снаружи должен быть виден только Caddy.
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/aardskelige/horsebio-frontend:latest
    container_name: horsebio_frontend
    # Портов наружу нет намеренно. Caddy ходит сюда по имени контейнера
    # через сеть Docker (`reverse_proxy horsebio_frontend:80`), и публикация
    # ему не нужна. Раньше здесь стояли "80:80" и "3001:80" — оба отвечали
    # снаружи и давали обход HTTPS: сайт открывался по голому HTTP.
    # Убрано 02.09.2026.
    expose:
      - "80"
    # nginx фронтенда резолвит upstream backend_nginx один раз, при старте,
    # и падает с "host not found in upstream", если тот ещё не поднялся.
    # Без depends_on порядок запуска не гарантирован — после перезагрузки
    # сервера 26.08.2026 фронтенд из-за этого не поднялся.
    depends_on:
      backend_nginx:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: horsebio_db_prod
    environment:
      - POSTGRES_DB=horsebio_db
      - POSTGRES_USER=horsebio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=500
    command: >
      postgres 
      -c max_connections=500
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_io_concurrency=200
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horsebio -d horsebio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped


volumes:
  backend_static:
  postgres_data:
  django_cache:
  scripts_logs:
  hb_returns_data:
  hb_buy_prices_data:
  hb_deadlines_data:
  hb_order_email_data:
  hb_cdek_waybills_data:
  hb_health_data:
  hb_site_orders_data:

networks:
  app-network:
    driver: bridge
